<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion Contacts</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="welcome-screen">
  <div class="welcome-icon">
    <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="30" cy="30" r="30" fill="#E8F0F7"/>
      <circle cx="30" cy="24" r="9" fill="#2C5F8A"/>
      <path d="M12 47c0-9.941 8.059-18 18-18s18 8.059 18 18" fill="#2C5F8A"/>
    </svg>
  </div>
  <h1 class="welcome-title">Mes Contacts</h1>
  <p class="welcome-subtitle">Retrouvez et gérez tous vos contacts en un instant</p>
  <div id="g_id_signin" class="signin-wrap"></div>
</div>

<header id="app-header" class="hidden">
  <h1>Mes Contacts</h1>
  <div id="user-info" class="hidden">
    <span id="user-email"></span>
    <button id="logout-btn">Deconnexion</button>
  </div>
</header>

<main id="app" class="hidden">

  <section id="search-zone">
    <input type="text" id="search-input" placeholder="Rechercher un contact...">
    <button id="add-btn">+ Ajouter</button>
  </section>

  <ul id="contact-list"></ul>

</main>

<div id="modal" class="hidden">
  <div class="modal-content">
    <h2 id="modal-title">Nouveau contact</h2>
    <input type="hidden" id="contact-id">
    <label>Nom</label>
    <input type="text" id="input-nom">
    <label>Telephone</label>
    <input type="text" id="input-telephone">
    <label>Email</label>
    <input type="email" id="input-email">

    <div id="admin-zone" class="hidden">
      <label>Code administrateur (requis, vous n'etes pas l'auteur)</label>
      <input type="password" id="input-admin-code">
    </div>

    <p id="form-error" class="error hidden"></p>

    <div class="modal-actions">
      <button id="save-btn">Enregistrer</button>
      <button id="delete-btn" class="danger hidden">Supprimer</button>
      <button id="cancel-btn">Annuler</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
